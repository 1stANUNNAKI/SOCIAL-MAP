<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityRT Prototype — نموذج المدينة الحية ثلاثي الأبعاد</title>
    <style>
      :root {
        --paper: rgba(243, 237, 224, 0.92);
        --paper-solid: #f3ede0;
        --ink: #2a2320;
        --ink-muted: #655850;
        --accent: #b85d3b;
        --accent-active: #1e6b5c;
        --border: rgba(42, 35, 32, 0.22);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ebe3d0;
        font-family: "Segoe UI", "Tahoma", system-ui, sans-serif;
        color: var(--ink);
      }

      #city-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
      }

      #city-canvas:active {
        cursor: grabbing;
      }

      /* Hand-drawn paper vignette & ink grain overlay */
      #paper-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        box-shadow: inset 0 0 85px rgba(42, 35, 32, 0.22);
        transition: opacity 0.3s ease;
      }

      /* Minimal Architectural Navigation & Environment Dock */
      .hud-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        transition: opacity 0.25s ease;
      }

      .hud-layer.hidden {
        opacity: 0;
        pointer-events: none !important;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
      }

      .sketch-card {
        pointer-events: auto;
        background: var(--paper);
        backdrop-filter: blur(8px);
        border: 2px solid var(--ink);
        border-radius: 10px 14px 11px 13px;
        box-shadow: 4px 4px 0 rgba(42, 35, 32, 0.18);
        padding: 12px 16px;
      }

      .brand-panel h1 {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .brand-panel p {
        font-size: 12.5px;
        color: var(--ink-muted);
        margin-top: 2px;
      }

      /* Navigation Mode Switcher */
      .nav-modes {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .sketch-btn {
        pointer-events: auto;
        appearance: none;
        background: var(--paper-solid);
        color: var(--ink);
        border: 1.8px solid var(--ink);
        border-radius: 8px 11px 9px 10px;
        padding: 7px 13px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 2px 2px 0 rgba(42, 35, 32, 0.16);
        transition: transform 0.1s ease, background 0.15s ease;
      }

      .sketch-btn:hover {
        background: #e9dec8;
        transform: translateY(-1px);
      }

      .sketch-btn.active {
        background: var(--ink);
        color: var(--paper-solid);
      }

      .sketch-btn kbd {
        background: rgba(128, 120, 110, 0.22);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
        font-family: monospace;
      }

      /* Bottom Environment & District Bar */
      .hud-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }

      .env-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }

      .ctrl-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .ctrl-group label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--ink-muted);
      }

      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      select.sketch-select,
      input[type="range"] {
        pointer-events: auto;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
        background: var(--paper-solid);
        border: 1.6px solid var(--ink);
        border-radius: 7px;
        padding: 4px 8px;
        cursor: pointer;
      }

      input[type="range"] {
        width: 115px;
        accent-color: var(--accent);
        padding: 0;
      }

      .districts-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* Focused building / active mode toast */
      #status-banner {
        position: fixed;
        top: 84px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
        pointer-events: none;
        background: var(--paper);
        border: 2px solid var(--ink);
        border-radius: 9px 12px 10px 11px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 3px 3px 0 rgba(42, 35, 32, 0.18);
        transition: opacity 0.2s ease;
      }

      /* Floating button to restore HUD when hidden */
      #toggle-hud-btn {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 25;
        pointer-events: auto;
      }
    </style>

  </head>
  <body>
    <canvas id="city-canvas"></canvas>
    <div id="paper-overlay"></div>

    <div id="status-banner">
      طور التحليق الحر — اسحب الفأرة للتنقل، انقر مرتين على أي مبنى للتركيز عليه، أو اضغط <kbd>G</kbd> للنزول إلى الشارع
    </div>

    <div class="hud-layer" id="hud-layer">
      <!-- Top Bar: Title + 3 Navigation Modes -->
      <div class="hud-top">
        <div class="sketch-card brand-panel">
          <h1>نموذج مدينة CityRT الثلاثي الأبعاد</h1>
          <p id="clock-readout">الساعة 10:30 صباحاً · 4 أحياء معمارية · نهر Catmull-Rom SDF · حركة مرور ومشاة حية</p>
        </div>

        <div class="sketch-card nav-modes">
          <button type="button" class="sketch-btn active" id="btn-mode-orbit">
            <span>تحليق حر (كاميرا العمدة)</span>
            <kbd>Esc</kbd>
          </button>
          <button type="button" class="sketch-btn" id="btn-mode-walk">
            <span>تجول على الأقدام</span>
            <kbd>G</kbd>
          </button>
          <button type="button" class="sketch-btn" id="btn-mode-drive">
            <span>ركوب وقيادة سيارة</span>
            <kbd>E</kbd>
          </button>
          <button type="button" class="sketch-btn" id="btn-camera-view" title="تبديل منظور الشخص الأول / الثالث">
            <span id="lbl-camera-view">منظور: خلف الكتف</span>
            <kbd>V</kbd>
          </button>
        </div>
      </div>

      <!-- Bottom Bar: Quick District Teleport + Atmosphere/Biome/Sketch Variables -->
      <div class="hud-bottom">
        <div class="sketch-card">
          <div class="ctrl-group">
            <label>انتقال فوري للأحياء والمعالم المعمارية (أو انقر مرتين على أي مبنى):</label>
            <div class="districts-bar">
              <button type="button" class="sketch-btn" data-fly="90,-98,48,-0.6">الحي العربي (سوق الزعفران)</button>
              <button type="button" class="sketch-btn" data-fly="-90,-98,48,0.5">الحي الأوروبي (برج الساعة)</button>
              <button type="button" class="sketch-btn" data-fly="-88,-44,36,0.3">طاحونة القناة والجسر</button>
              <button type="button" class="sketch-btn" data-fly="-90,56,46,0.6">الحي الياباني (الباغودا)</button>
              <button type="button" class="sketch-btn" data-fly="90,56,58,-0.6">حي الأبراج والنيون</button>
              <button type="button" class="sketch-btn" data-fly="-15,54,42,0.0">الحديقة المركزية والنافورة</button>
            </div>
          </div>
        </div>

        <div class="sketch-card env-controls">
          <div class="ctrl-group">
            <label for="time-slider">الوقت والإضاءة (24 ساعة):</label>
            <div class="ctrl-row">
              <input type="range" id="time-slider" min="0" max="24" step="0.1" value="10.5" />
              <button type="button" class="sketch-btn" id="btn-time-auto">دورة تلقائية</button>
            </div>
          </div>

          <div class="ctrl-group">
            <label for="biome-select">الإقليم والغطاء النباتي (Biome):</label>
            <select id="biome-select" class="sketch-select">
              <option value="meadow">المروج الخضراء (Meadow)</option>
              <option value="sakura">ربيع الساكورا (Sakura)</option>
              <option value="autumn">الخريف الذهبي (Autumn)</option>
              <option value="desert">الصحراء العربية (Desert)</option>
              <option value="tundra">التندرا القطبية (Tundra)</option>
              <option value="tropics">الجزر الاستوائية (Tropics)</option>
              <option value="mars">كوكب المريخ (Mars)</option>
              <option value="blueprint">المخطط الهندسي (Blueprint)</option>
            </select>
          </div>

          <div class="ctrl-group">
            <label for="weather-select">الطقس والجو:</label>
            <select id="weather-select" class="sketch-select">
              <option value="clear">جو صافي ومشمس</option>
              <option value="rain">أمطار غزيرة (Rain)</option>
              <option value="snow">ثلوج متساقطة (Snow)</option>
              <option value="sakura">بتلات أزهار الكرز (Sakura)</option>
            </select>
          </div>

          <div class="ctrl-group">
            <label for="sketch-select">تظليل القلم والحبر (NPR Shader):</label>
            <select id="sketch-select" class="sketch-select">
              <option value="sketch">الرسم الهندسي بالقلم (Clean Sketch)</option>
              <option value="pencil">تهشير القلم الرصاص (Soft Pencil)</option>
              <option value="inkwash">الحبر والغسيل (Ink & Wash)</option>
              <option value="vivid">الألوان المعمارية الحية (Vivid)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="sketch-btn" id="toggle-hud-btn" title="إخفاء أو إظهار اللوحة لرؤية النموذج بالكامل">
      <span>إخفاء/إظهار الواجهة</span>
      <kbd>Tab</kbd>
    </button>

  </body>
</html>
